name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Restore
        run: |
          dotnet restore SharpTls/SharpTls.slnx
          dotnet restore TlsClient-main/TlsClient.slnx
      - name: Build
        run: |
          dotnet build SharpTls/SharpTls.slnx --no-restore --configuration Release
          dotnet build TlsClient-main/TlsClient.slnx --no-restore --configuration Release
      - name: Test SharpTls
        run: dotnet test SharpTls/tests/SharpTls.Tests --no-build --configuration Release --logger "console;verbosity=minimal"
      - name: Test TlsClient
        run: dotnet test TlsClient-main/tests/TlsClient.Tests --no-build --configuration Release --logger "console;verbosity=minimal"

  pack:
    name: Pack
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Pack both packages
        run: |
          dotnet pack SharpTls/src/SharpTls --configuration Release --output artifacts
          dotnet pack TlsClient-main/src/TlsClient --configuration Release --output artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*.nupkg
